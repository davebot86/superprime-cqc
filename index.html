<title>SPS Critical Quality Check</title>
<style>
/* VOICE: calm, premium site tool. One job per screen, big targets, no clutter.
   IDEA: a QA hold-point tag — numbered, stamped, signed.
   PICTURE: the live question card is the screen.
   COLOUR/TYPE: SuperPrime ink + warm paper + bronze accent; Kamerik 105 (falls back to Avenir Next on iPhone).
   LAYOUT: single column, thumb-zone controls fixed at the bottom. */
@font-face{font-family:"Kamerik 105";src:local("Kamerik 105"),local("Kamerik105-Book"),url("Kamerik105-Book.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Kamerik 105";src:local("Kamerik 105 Bold"),local("Kamerik105-Bold"),url("Kamerik105-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{
  /* Brand tokens — swap hex values here to match the SuperPrime brand kit */
  --ink:#15181C;--ink2:#2A2F35;--paper:#F5F3EF;--card:#FFFFFF;--line:#E2DDD4;--muted:#6E6A63;
  --accent:#9C7A4E;--accent-ink:#FFFFFF;
  --yes:#2E7D4F;--no:#B3261E;--na:#6E6A63;--warn:#B26A00;
  --font:"Kamerik 105","Avenir Next","Avenir","Helvetica Neue",system-ui,sans-serif;
  --r:14px;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--font);overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn,.chip,.item,label.btn{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
html{-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{-webkit-tap-highlight-color:transparent}
.sheet{-webkit-overflow-scrolling:touch;padding-bottom:calc(18px + var(--safeB) + 8px)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,#1B1F24,#111417);color:#fff;padding:calc(var(--safeT) + 14px) 18px 13px;display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--accent)}
.top .brand{display:flex;flex-direction:column;gap:5px;line-height:1;flex:none;white-space:nowrap}
.brand.sps,.sps{display:flex;flex-direction:row;align-items:center;gap:9px;color:#fff}.sps .spm{height:34px;width:auto;flex:none}.spt{display:flex;flex-direction:column;line-height:1.02;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;letter-spacing:-.01em}.spt b{font-weight:700}.spt span{font-weight:400}.lockb{color:var(--ink,#15181C);justify-content:center;margin-bottom:10px}.lockb .spm{height:56px}.lockb .spt{font-size:22px}.top .sp .mpx{height:22px;width:auto;display:block}.mpxf{height:26px;width:auto;margin:10px 0 2px;opacity:.9}.fsps{display:inline-flex;align-items:center;gap:8px;color:#fff}.fsps .spm{height:22px;width:auto}.fsps b{letter-spacing:0;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.wm{font-weight:800;letter-spacing:.36em;font-size:17px;margin-right:-.36em}
.tag{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:#C9AE86}
.top .sp{display:flex;flex-direction:column;align-items:flex-end;gap:5px;line-height:1.1;text-align:right;padding-left:14px;border-left:1px solid rgba(255,255,255,.18);margin-left:auto;flex:1 1 0;min-width:0}
.top .sp b{font-size:10.5px;letter-spacing:.28em;font-weight:700;color:#C9AE86}
.top .sp span{font-size:13px;color:#fff;opacity:.92;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .back{flex:none}
@media(max-width:400px){.wm{font-size:15px;letter-spacing:.28em}.tag{font-size:9.5px;letter-spacing:.16em}}
.dict{background:var(--no)!important;color:#fff!important;border-color:var(--no)!important}
#nt.live{border-color:var(--no);box-shadow:0 0 0 2px rgba(179,38,30,.15)}
.vh{position:absolute!important;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.qrow{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow .r{font-weight:700;min-width:38px}
.qrow .m{font-size:12px;color:var(--muted);margin-top:4px}
.top .back{background:none;border:0;color:#fff;font-size:15px;padding:10px 6px;margin-left:-6px}
main{max-width:720px;margin:0 auto;padding:16px 16px calc(120px + var(--safeB))}
h1{font-size:26px;line-height:1.1;margin:8px 0 4px;font-weight:700}
h2{font-size:18px;margin:22px 0 8px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:10px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600}
a.btn{color:inherit;text-decoration:none}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input.t,select.t,textarea.t{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 12px;font-size:16px}
textarea.t{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;min-width:52px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:600}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.list .item{display:flex;gap:12px;align-items:center;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:8px 0;width:100%;text-align:left}
.item .meta{flex:1}
.item .t1{font-weight:700}
.item .t2{font-size:13px;color:var(--muted)}
.mx{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}.mx td,.mx th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}.mx td+td,.mx th+th{text-align:right;white-space:nowrap;font-weight:700}
.done{background:linear-gradient(rgba(16,14,13,.78),rgba(16,14,13,.78)),url(marble.jpg) center/cover;color:#fff;border-radius:12px;padding:14px;margin:-4px -4px 10px}
.band{height:56px;margin:-6px -16px 14px;background:linear-gradient(90deg,rgba(244,242,238,.0),rgba(244,242,238,.0)),url(onyx.jpg) center/cover;opacity:.9}
.insbar{display:flex;justify-content:space-between;align-items:center;width:100%;margin:2px 0 10px;padding:10px 14px;border-radius:12px;border:1px solid rgba(201,174,134,.6);background:#fff;font:600 14px inherit;color:var(--ink);text-align:left}.insbar b{color:var(--accent);font-size:13px}
.pill{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--line);color:var(--ink);white-space:nowrap}
.pill.Y{background:var(--yes);color:#fff}.pill.N{background:var(--no);color:#fff}.pill.NA{background:var(--na);color:#fff}
.pill.draft{background:#EFE6D8;color:#6B4F2A}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:8px}
.legend b{color:var(--ink)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* question screen */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:4px}
.prog{height:4px;background:var(--line);border-radius:2px;margin:10px 0 14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.sect{font-size:13px;font-weight:700;letter-spacing:.04em;color:var(--accent)}
.qref{font-size:40px;font-weight:700;line-height:1;margin:6px 0 8px}
.qtext{font-size:21px;line-height:1.3;margin:0 0 12px;font-weight:600;text-wrap:pretty}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.src{font-size:13px;color:var(--muted);margin-top:8px}
.ans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:16px 0}
.ans button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:19px;font-weight:700}
.ans button[data-v=Y][aria-pressed=true]{background:var(--yes);border-color:var(--yes);color:#fff}
.ans button[data-v=N][aria-pressed=true]{background:var(--no);border-color:var(--no);color:#fff}
.ans button[data-v=NA][aria-pressed=true]{background:var(--na);border-color:var(--na);color:#fff}
.ev{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ev .btn{min-height:56px}
.req{font-size:12px;font-weight:700;color:var(--warn)}
.thumbs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.th{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:#ddd}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .st{position:absolute;left:0;right:0;bottom:0;background:rgba(21,24,28,.82);color:#fff;font-size:10px;padding:3px 5px;line-height:1.2}
.th button{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1}
.clips{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.clip{display:flex;align-items:center;gap:8px;font-size:13px}
.clip audio{height:34px;flex:1}
.good{margin-top:12px;border-left:4px solid var(--yes);padding:6px 12px;background:#EEF5F0;border-radius:6px;font-size:14px}
.good img{max-width:100%;border-radius:8px;margin-top:6px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(245,243,239,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safeB))}
.dock .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px}
.rec{background:var(--no)!important;color:#fff!important;border-color:var(--no)!important}
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.ov button{min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;position:relative}
.ov button.Y{background:var(--yes);color:#fff;border-color:var(--yes)}
.ov button.N{background:var(--no);color:#fff;border-color:var(--no)}
.ov button.NA{background:var(--na);color:#fff;border-color:var(--na)}
.ov button.cur{outline:3px solid var(--accent);outline-offset:1px}
.ov button .cam{position:absolute;top:2px;right:4px;font-size:10px}
.issue{border-left:4px solid var(--no);padding:8px 12px;margin:8px 0;background:var(--card);border-radius:8px}
.issue .r{font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:30px 0 0;line-height:1.6}
.foot b{color:var(--ink);letter-spacing:.14em}
.modal{position:fixed;inset:0;z-index:20;background:rgba(21,24,28,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safeB));max-height:88vh;overflow:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--safeB));background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.busy{position:fixed;inset:0;z-index:40;background:rgba(245,243,239,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:600}
.spin{width:38px;height:38px;border:4px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}


/* ---- Multiplex web language layered on SPS ---- */
:root{--font:"Helvetica Neue","Kamerik 105",Helvetica,Arial,system-ui,sans-serif}
.top{background:#000!important;justify-content:space-between}
.wm{font-weight:900;letter-spacing:.045em;font-size:21px;margin-right:0;font-family:"Helvetica Neue",Arial,sans-serif}

h1{font-weight:600;letter-spacing:-.02em}

.foot{background:#000;color:#8E8E8E;margin:30px -16px calc(-120px - var(--safeB));padding:26px 16px calc(130px + var(--safeB))}

/* ---- motion & SPS polish ---- */
.std{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px;margin:4px 0 6px;border-radius:16px;border:1px solid rgba(201,174,134,.45);background:linear-gradient(100deg,rgba(18,20,24,.92) 35%,rgba(18,20,24,.55)),url(slats.jpg) center/cover;color:#fff;box-shadow:0 10px 24px -14px rgba(21,24,28,.7)}

.std-t{flex:1;display:flex;flex-direction:column;gap:3px}.std-k{font-size:10px;letter-spacing:.24em;color:#C9AE86;font-weight:700}.std-t b{font-size:17px}.std-s{font-size:12.5px;color:#CFC8BC}

#app{will-change:transform,opacity}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inU{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.a-r{animation:inR .32s cubic-bezier(.2,.8,.2,1) both}.a-l{animation:inL .32s cubic-bezier(.2,.8,.2,1) both}.a-u{animation:inU .36s cubic-bezier(.2,.8,.2,1) both}
.a-u .card,.a-u .item,.a-r .item{animation:inU .4s cubic-bezier(.2,.8,.2,1) both}
.a-u .list .item:nth-child(2),.a-r .list .item:nth-child(2){animation-delay:.04s}.a-u .list .item:nth-child(3),.a-r .list .item:nth-child(3){animation-delay:.08s}.a-u .list .item:nth-child(n+4),.a-r .list .item:nth-child(n+4){animation-delay:.12s}
.btn,.chip,.item,.ans button,.ov button,.seg button{transition:transform .12s ease,background-color .18s ease,border-color .18s ease,box-shadow .18s ease}
.btn:active,.chip:active,.item:active,.ov button:active,.seg button:active{transform:scale(.97)}

@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}

.card,.item{box-shadow:0 1px 0 rgba(21,24,28,.03),0 6px 18px -12px rgba(21,24,28,.18)}

.toast{transform:translate(-50%,10px)}.toast.on{transform:translate(-50%,0);transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
.hero{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 100% 0%,#2A2F35 0%,#15181C 55%,#0E1013 100%);color:#fff;border-radius:18px;padding:22px 20px 20px;margin:4px 0 14px}
.hero::after{content:"";position:absolute;inset:8px;border:1px solid rgba(201,174,134,.35);border-radius:12px;pointer-events:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.srch{position:sticky;top:0;z-index:4;background:var(--paper);padding:8px 0 10px}

.seg button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.big{font-size:48px;font-weight:800;line-height:1;margin:6px 0}
.sgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.sgrid div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.sgrid b{display:block;font-size:20px}.sgrid span{font-size:12px;color:var(--muted)}
.rules li{margin:6px 0}
.tagf{font-size:12px;font-weight:700;color:var(--accent)}
.hide{display:none!important}
small.hint{display:block;color:var(--muted);font-size:12px;margin-top:6px}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 0}.gt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card,#fff);border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;color:inherit;min-height:58px;cursor:pointer}.gt .gi{width:38px;height:38px;flex:none;border-radius:10px;background:#1a1c20;color:#C9AE86;display:grid;place-items:center}.gt .gi svg{width:24px;height:24px}.gh{display:inline-grid;vertical-align:-5px;margin-right:6px;color:var(--accent,#9a7a4f)}.gh svg{width:18px;height:18px}.gt .gn{flex:1;font-weight:650;font-size:13.5px;line-height:1.25}.gt .gc{font-size:12px;color:var(--muted);font-weight:700}.grp{scroll-margin-top:70px}
.th .mk{left:6px;right:auto}.sev .chip[aria-pressed=true]{background:var(--no);color:#fff;border-color:var(--no)}
.quote{display:block;width:100%;text-align:left;background:var(--card,#fff);border:1px solid var(--line);border-left:4px solid #C9AE86;border-radius:14px;padding:14px 16px;margin:14px 0 4px;font:inherit;color:inherit;cursor:pointer}.quote .qk{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:#9a7a4f}.quote .qq{display:block;font-size:17px;font-weight:650;line-height:1.35;margin:6px 0 6px}.quote .qn{font-size:12px;color:var(--muted)}
.chip.apt{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;padding-top:6px;padding-bottom:6px}.chip.apt small{font-size:10.5px;font-weight:500;opacity:.7;margin-top:2px}
body.locked .dock{display:none}.lock{max-width:420px;margin:8vh auto 0;padding:0 6px}.lock .wm{font-weight:900;letter-spacing:.06em;font-size:26px}.lock .tg{color:#C9AE86;letter-spacing:.28em;font-size:10px;font-weight:700;margin-bottom:28px}.lock .eb{letter-spacing:.2em;font-size:11px;font-weight:800;color:var(--muted)}
</style>

/* ---------- storage (IndexedDB with memory fallback) ---------- */
let db=null;const mem={checks:new Map(),media:new Map(),modules:new Map()};
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('sp-cqc',1);r.onupgradeneeded=()=>{const d=r.result;['checks','media','modules'].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s)})};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>res()}catch(e){res()}})}
function tx(store,mode,fn){return new Promise((res,rej)=>{if(!db){res(fn(null));return}try{const t=db.transaction(store,mode),s=t.objectStore(store);const out=fn(s);t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out);t.onerror=()=>rej(t.error)}catch(e){rej(e)}})}
const put=(store,key,val)=>db?tx(store,'readwrite',s=>s.put(val,key)):(mem[store].set(key,val),Promise.resolve());
const get=(store,key)=>db?tx(store,'readonly',s=>s.get(key)):Promise.resolve(mem[store].get(key));
const del=(store,key)=>db?tx(store,'readwrite',s=>s.delete(key)):(mem[store].delete(key),Promise.resolve());
const all=store=>db?new Promise((res,rej)=>{const t=db.transaction(store,'readonly');const r=t.objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}):Promise.resolve([...mem[store].values()]);
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem('cqc.'+k)||'';localStorage.setItem('cqc.'+k,v)}catch(e){return ''}};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const fmtDT=t=>{const d=new Date(t);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtD=t=>{const d=new Date(t);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const stampT=t=>{const d=new Date(t);return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`};
const isoD=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const safe=s=>String(s||'').trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
const ansLabel={Y:'YES',N:'NO',NA:'N/A'};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200)}
function busy(on,msg){let b=$('#busy');if(on){if(!b){b=document.createElement('div');b.id='busy';b.className='busy';document.body.appendChild(b)}b.innerHTML=`<div class="spin"></div><div>${esc(msg||'Working…')}</div>`}else if(b)b.remove()}

/* ---------- modules ---------- */
let modules=[];
async function loadModules(){const extra=await all('modules').catch(()=>[]);const m=new Map();BUILTIN.forEach(x=>m.set(x.id,{...x,builtin:true}));extra.forEach(x=>m.set(x.id,x));modules=[...m.values()]}
const modById=id=>modules.find(m=>m.id===id);
function validateModule(m){if(!m||typeof m!=='object')throw 'Not a module file';if(!m.id||!m.title||!Array.isArray(m.sections))throw 'Module needs id, title and sections';m.sections.forEach(s=>{if(!s.id||!Array.isArray(s.questions))throw 'Each section needs id and questions';s.questions.forEach(q=>{if(!q.ref||!q.q)throw 'Each question needs ref and q';q.evidence=q.evidence||'photo';q.trade=q.trade||'All'})});return m}
function scopeQs(check){const m=modById(check.moduleId);if(!m)return [];const out=[];const key=check.depth==='key';m.sections.forEach(s=>{if(check.sections.includes(s.id))s.questions.forEach(q=>{if(!key||q.critical)out.push({...q,section:s})})});return out}
const keyCount=(m,secs)=>m.sections.filter(s=>!secs||secs.includes(s.id)).reduce((a,s)=>a+s.questions.filter(q=>q.critical).length,0);
const allCount=(m,secs)=>m.sections.filter(s=>!secs||secs.includes(s.id)).reduce((a,s)=>a+s.questions.length,0);


/* ---------- module search (activities) ---------- */
const norm=t=>String(t||'').toLowerCase();
function modMatches(m,q){if(!q)return{ok:true,qs:0};const w=norm(q).split(/\s+/).filter(Boolean);const head=norm([m.title,m.short,m.group,m.activity,(m.tags||[]).join(' ')].join(' '));
  const qHits=[];m.sections.forEach(s=>s.questions.forEach(x=>{const t=norm(x.q+' '+x.trade+' '+s.title);if(w.every(k=>t.includes(k)||head.includes(k)))qHits.push(x)}));
  qHits.sort((x,y)=>(w.every(k=>norm(y.q).includes(k))?1:0)-(w.every(k=>norm(x.q).includes(k))?1:0));
  const ok=w.every(k=>head.includes(k))||qHits.length>0;return{ok,qs:w.every(k=>head.includes(k))?0:qHits.length,first:qHits[0]}}
function hl(t,q){const e=esc(t);if(!q)return e;let out=e;norm(q).split(/\s+/).filter(k=>k.length>1).forEach(k=>{out=out.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<mark>$1</mark>')});return out}

const gid=g=>'g-'+g.toLowerCase().replace(/[^a-z0-9]+/g,'-');
function groupTiles(){const c={};modules.forEach(m=>{const g=m.group||'Other';c[g]=(c[g]||0)+1});return `<div class="gtiles">${Object.keys(c).sort().map(g=>`<button class="gt" data-grp="${esc(g)}"><span class="gi">${GICON[g]||''}</span><span class="gn">${esc(GSHORT[g]||g)}</span><span class="gc">${c[g]}</span></button>`).join('')}</div>`}
function modListHTML(q,attr){const G=attr==='data-open'&&!q?modsView.grp:'';const res=modules.map(m=>({m,r:modMatches(m,q)})).filter(x=>x.r.ok&&(!G||x.m.group===G));
  if(!res.length)return `<div class="card"><p class="sub" style="margin:0">No check matches "${esc(q)}". Try a trade (MEA, PBS), an activity (riser, doors) or a word from a question.</p></div>`;
  const sc=x=>{if(!q)return 0;const t=norm(x.m.title+' '+x.m.short);return t.includes(norm(q))?3:x.r.qs===0?2:1};res.forEach(x=>x.s=sc(x));
  if(q){res.sort((a,b)=>b.s-a.s);return `<div class="grp">${res.length} match${res.length>1?'es':''}</div><div class="list">${res.map(x=>itemHTML(x.m,x.r,q,attr)).join('')}</div>`}
  const groups={};res.forEach(x=>{const g=x.m.group||'Other';(groups[g]=groups[g]||[]).push(x)});
  let html='';
  if(G)html+=`<button class="btn block" id="allG" style="margin:4px 0 6px">‹ All inspection types</button>`;if(!q&&!G){const rec=recentMods().map(modById).filter(Boolean);if(rec.length)html+=`<div class="grp">Recently used</div><div class="list">${rec.map(m=>itemHTML(m,{qs:0},q,attr)).join('')}</div>`}
  Object.keys(groups).sort().forEach(g=>{html+=`<div class="grp" id="${gid(g)}"><span class="gh">${GICON[g]||''}</span>${esc(g)} · ${groups[g].length}</div><div class="list">${groups[g].map(x=>itemHTML(x.m,x.r,q,attr)).join('')}</div>`});return html}
function itemHTML(m,r,q,attr){const n=m.sections.reduce((a,s)=>a+s.questions.length,0);const tag=revTag(m)||(/example/i.test(m.version||'')?'<span class="pill">Example</span>':/draft/i.test(m.status||m.version||'')?'<span class="pill draft">Draft</span>':'');
  return `<button class="item" ${attr}="${esc(m.id)}"><div class="meta"><div class="t1">${hl(m.title,q)}</div><div class="t2">${hl(m.activity||'',q)}${m.activity?' · ':''}${m.sections.length} stages · ${n} checks</div>${r.qs?`<div class="hit">${r.qs} question${r.qs>1?'s':''} match · e.g. ${esc(r.first.ref)} ${hl(r.first.q.slice(0,70),q)}${r.first.q.length>70?'…':''}</div>`:''}</div>${tag}<span aria-hidden="true" style="font-size:22px;color:var(--muted)">›</span></button>`}
function pickModuleSheet(onPick){sheet(`<h2 style="margin-top:0">Choose a check</h2><div class="srch"><input id="ms" type="search" placeholder="Search activity, trade or question" autocomplete="off"></div><div id="ml"></div>`);
  const draw=()=>{$('#ml').innerHTML=modListHTML($('#ms').value.trim(),'data-pk');document.querySelectorAll('[data-pk]').forEach(b=>b.onclick=()=>{closeSheet();onPick(b.dataset.pk)})};
  $('#ms').oninput=()=>{modsView.grp='';draw()};draw();}

function photoName(check,q,p,n){const a=check.answers[q.ref]?.a;return `CQC_B${safe(check.block)}_${safe(check.walk&&check.answers[q.ref]?.unit?check.answers[q.ref].unit:check.area)}_L${safe(check.level)}_Q${q.ref.replace('.','-')}_${a?safe(ansLabel[a]):'OPEN'}_${safe(q.trade)}_${stampT(p.time)}_${n}.jpg`}
function baseName(check){return `CQC_${safe(modById(check.moduleId)?.short||check.moduleId)}_B${safe(check.block)}_${safe(check.area)}_L${safe(check.level)}_v${check.exports+1}_${isoD(Date.now())}`}

/* ---------- FINISH / EXPORT ---------- */
function finish(){view='finish';freeThumbs();const s=stats(cur);setTop('Finish',checkHome);
  const issues=s.qs.filter(q=>cur.answers[q.ref]?.a==='N');const byTrade={};issues.forEach(q=>{const t=tagFor(q,cur);(byTrade[t]=byTrade[t]||[]).push(q)});
  const gaps=s.qs.filter(q=>{const a=cur.answers[q.ref]||{};const ph=cur.media.some(x=>x.ref===q.ref&&x.kind==='photo');return a.a&&a.a!=='NA'&&q.evidence!=='none'&&!ph&&a.cert!=='chased'});

  ${noNote.length?`<div class="card" style="border-color:var(--no)"><b style="color:var(--no)">${noNote.length} No answer${noNote.length>1?'s':''} without a note</b><p class="sub" style="margin:6px 0 10px">Say what's wrong so the trade can be tagged properly. Tap to fix:</p><div class="chips">${noNote.map(q=>`<button class="chip" data-fix="${esc(q.ref)}">${esc(q.ref)}</button>`).join('')}</div></div>`:''}
  ${noUnit.length?`<div class="card" style="border-color:var(--no)"><b style="color:var(--no)">${noUnit.length} No answer${noUnit.length>1?'s':''} without an apartment</b><p class="sub" style="margin:6px 0 10px">Tap to say which apartment:</p><div class="chips">${noUnit.map(q=>`<button class="chip" data-fix="${esc(q.ref)}">${esc(q.ref)}</button>`).join('')}</div></div>`:''}
  ${openQs.length?`<div class="card" style="border-color:var(--warn)"><b style="color:var(--warn)">${openQs.length} not answered</b><p class="sub" style="margin:6px 0 0">${openQs.map(q=>esc(q.ref)).join(', ')} — they'll show as open in the report.</p></div>`:''}
  ${gaps.length?`<div class="card" style="border-color:var(--warn)"><b style="color:var(--warn)">${gaps.length} missing evidence</b><p class="sub" style="margin:6px 0 0">${gaps.map(q=>esc(q.ref)).join(', ')}</p></div>`:''}
  <h2>Issues for trades (${issues.length})</h2>${issues.length?Object.entries(byTrade).map(([t,qs])=>`<div class="sect" style="margin-top:12px">Tag in Field: ${esc(t)}</div>${qs.map(q=>`<div class="issue"><span class="r">${esc(q.ref)}</span>${cur.walk&&cur.answers[q.ref]?.unit?` <b>${esc(cur.answers[q.ref].unit)}</b> ·`:''} ${esc(q.q)}${cur.answers[q.ref]?.note?`<div class="sub" style="margin:4px 0 0">“${esc(cur.answers[q.ref].note)}”</div>`:''}</div>`).join('')}`).join(''):`<p class="sub">No issues raised.</p>`}
  <h2>Send it</h2><p class="sub">1. Share the <b>report PDF</b> to the Critical Quality Checks agent in Copilot.<br>2. Upload the finished report to Aconex Field and tag the trades.</p>
  <button class="btn primary block" id="pdf">Create report PDF</button><div style="height:10px"></div><button class="btn block" id="zip">Evidence pack (.zip: photos, voice notes, data)</button>
  <div id="out"></div>${nextUnit(cur)?`<h2>Keep going</h2><button class="btn block" id="nxa" style="border-color:var(--accent)">▶ Next apartment – ${esc(nextUnit(cur).area)} · same check</button>`:''}${foot()}`;
  dock('');
  $('#pdf').onclick=()=>doExport('pdf');$('#zip').onclick=()=>doExport('zip');

  document.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{qi=s.qs.findIndex(q=>q.ref===b.dataset.fix);question()});
}
async function doExport(kind){busy(true,kind==='pdf'?'Stamping photos and building the report…':'Packing evidence…');try{const name=baseName(cur);let file;
  if(kind==='pdf'){const blob=await buildPDF(cur);file=new File([blob],name+'.pdf',{type:'application/pdf'})}
  else{const blob=await buildZip(cur,name);file=new File([blob],name+'.zip',{type:'application/zip'})}
  cur.exports++;cur.lastExport=Date.now();await save();busy(false);offerFile(file)}catch(e){busy(false);console.error(e);toast('Export failed: '+(e.message||e))}}
function offerFile(file){const u=URL.createObjectURL(file);const canShare=navigator.canShare&&navigator.canShare({files:[file]});
  $('#out').innerHTML=`<div class="card" style="margin-top:14px"><div class="done"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="29"/><path d="M20 33l8 8 16-17"/></svg><b>Report ready</b></div><b>${esc(file.name)}</b><p class="sub" style="margin:4px 0 10px">${(file.size/1048576).toFixed(1)} MB</p>${canShare?'<button class="btn primary block" id="shr">Share to Copilot…</button>':''}<a class="btn block" style="margin-top:8px" href="${u}" download="${esc(file.name)}">${canShare?'Or save a copy':'Save to Files'}</a><small class="hint">${isIOS?'In the share sheet tap Copilot. If it isn\'t shown, swipe the app row and tap More.':'Share → Copilot to send it straight to the agent.'}</small></div><div class="card"><b>Sent to Copilot?</b><p class="sub" style="margin:6px 0 10px">Free up space by clearing this check and its photos from the phone. Only do this once the report is safely with the agent.</p><button class="btn block" id="clr" style="color:var(--no)">Clear this check from the phone</button></div>`;
  $('#clr').onclick=()=>confirmSheet('Clear this check and its photos from this phone? Make sure the report has been sent first.','Clear',async()=>{for(const x of cur.media)await del('media',x.id);await del('checks',cur.id);cur=null;toast('Check cleared');home()});
  $('#shr')&&($('#shr').onclick=async()=>{try{await navigator.share({files:[file],title:file.name})}catch(e){}});
  $('#out').scrollIntoView({behavior:'smooth'});
}

async function buildZip(check,name){const z=new JSZip();const s=stats(check);const f=z.folder(name);const photos=f.folder('photos');const audio=f.folder('voice-notes');
  const manifest=[];for(const q of s.qs){let n=0;for(const p of check.media.filter(x=>x.ref===q.ref)){if(p.kind==='photo'){n++;const st=await stampPhoto(p,q,check,1920,0.85);const fn=photoName(check,q,p,n);photos.file(fn,st.blob);manifest.push({ref:q.ref,file:'photos/'+fn,time:p.time})}else{const b=await get('media',p.id);const ext=(p.mime||'').includes('webm')?'webm':'m4a';const fn=photoName(check,q,p,'voice').replace('.jpg','.'+ext);audio.file(fn,b);manifest.push({ref:q.ref,file:'voice-notes/'+fn,time:p.time})}}}
  f.file('data.json',JSON.stringify(exportData(check,manifest),null,1));
  f.file(name+'.pdf',await buildPDF(check));
  return z.generateAsync({type:'blob',compression:'STORE'});
}
function exportData(check,manifest){const s=stats(check);return{format:'SJWS-CQC-v1',app:APP_VERSION,project:PROJECT,module:{id:check.moduleId,title:check.moduleTitle,version:check.moduleVersion},location:{block:check.block,[check.areaLabel.toLowerCase()]:check.area,level:check.level},inspector:check.inspector,role:check.role,started:new Date(check.created).toISOString(),visits:check.visits.map(v=>new Date(v).toISOString()),exported:new Date().toISOString(),summary:{inScope:s.total,yes:s.Y,no:s.N,na:s.NA,open:s.open,photos:s.photos},items:s.qs.map(q=>{const a=check.answers[q.ref]||{};return{ref:q.ref,stage:q.section.id+'. '+q.section.title,question:q.q,trade:q.trade,fieldAssignee:tagFor(q,check),evidenceRequired:q.evidence,answer:a.a?ansLabel[a.a]:'OPEN',severity:a.a==='N'?(a.sev||''):'',measured:a.a==='N'&&a.meas?a.meas+' '+(a.measUnit||''):'',note:a.note||'',certificate:a.cert==='chased'?'Not on site - chased':'',answeredAt:a.t?new Date(a.t).toISOString():null,source:q.source,files:(manifest||[]).filter(x=>x.ref===q.ref).map(x=>x.file)}})}}

async function buildPDF(check){const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});const W=210,H=297,M=14;const s=stats(check);
  const INK=[21,24,28],MUT=[110,106,99],ACC=[156,122,78],YES=[46,125,79],NO=[179,38,30],NA=[110,106,99],LINE=[226,221,212];
  const colA=a=>a==='Y'?YES:a==='N'?NO:a==='NA'?NA:LINE;
  let y=0;
  const WMK=(()=>{const c=document.createElement('canvas');c.width=1100;c.height=220;const g=c.getContext('2d');g.save();const s=200/682.21;g.translate(4,10);g.scale(s,s);g.fillStyle='#fff';g.fill(new Path2D(SPSPATH));g.restore();g.fillStyle='#fff';g.textBaseline='alphabetic';g.font='700 84px "Helvetica Neue",Helvetica,Arial,sans-serif';g.fillText('Super Prime',150,96);g.font='400 84px "Helvetica Neue",Helvetica,Arial,sans-serif';g.fillText('Standards',150,190);return c.toDataURL('image/png')})();
  const header=()=>{doc.setFillColor(...INK);doc.rect(0,0,W,16,'F');doc.addImage(WMK,'PNG',M,2.6,52,10.4);doc.addImage(MPXLOGO,'PNG',W-M-33,2.4,33,6.8);doc.setTextColor(255);doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.text(P(`Critical Quality Check · ${check.moduleTitle} · ${areaName(check.block)}${check.level&&check.level!=='RF'?' L'+lvLbl(check.level):''}`),W-M,13.4,{align:'right'});y=24};
  const newPage=()=>{doc.addPage();header()};
  const need=h=>{if(y+h>H-16)newPage()};
  const P=t=>String(t??'').replace(/≤/g,'<=').replace(/≥/g,'>=').replace(/±/g,'+/-').replace(/×/g,'x').replace(/[–—]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...').replace(/[^\x00-\xFF]/g,'');
  const split=(t,w,size,style)=>{doc.setFont('helvetica',style||'normal');doc.setFontSize(size);return doc.splitTextToSize(P(t),w)};
  const txt=(t,x,size,style,color,maxW)=>{doc.setFont('helvetica',style||'normal');doc.setFontSize(size);doc.setTextColor(...(color||INK));const lines=doc.splitTextToSize(P(t),maxW||W-2*M);doc.text(lines,x,y);return lines.length*size*0.42};
  header();
  // title block
  doc.setTextColor(...ACC);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text((check.depth==='key'?'KEY CRITICAL SPOT CHECK':'FULL DETAIL CHECK')+' — SITE RECORD',M,y);y+=8;
  y+=txt(check.moduleTitle,M,20,'bold');y+=1;
  y+=txt(`${PROJECT} · ${locLabel(check)}`,M,11,'normal',MUT);y+=4;
  const kv=[['Main contractor','Multiplex Construction Europe Ltd'],['Inspected by',`${check.inspector}${check.role?' ('+check.role+')':''}`],['Visits',check.visits.map(fmtD).join(', ')],['Report created',fmtDT(Date.now())],['Module version',check.moduleVersion],['Stages in scope',modById(check.moduleId).sections.filter(x=>check.sections.includes(x.id)).map(x=>x.id+'. '+x.title).join('; ')]];
  kv.forEach(([k,v])=>{doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...MUT);doc.text(k,M,y);const h=txt(v,M+34,9,'normal',INK,W-2*M-34);y+=Math.max(5,h+1.5)});
  y+=4;
  // health bar
  const bw=W-2*M;let bx=M;[['Y',s.Y],['N',s.N],['NA',s.NA],['',s.open]].forEach(([k,v])=>{if(!v)return;const w=bw*v/s.total;doc.setFillColor(...colA(k));doc.rect(bx,y,w,5,'F');bx+=w});y+=10;
  const boxes=[['Yes',s.Y,YES],['No (issues)',s.N,NO],['N/A',s.NA,NA],['Open',s.open,MUT],['Photos',s.photos,ACC]];const bxw=(bw-4*3)/5;
  boxes.forEach(([l,v,c],i)=>{const x=M+i*(bxw+3);doc.setDrawColor(...LINE);doc.setFillColor(255,255,255);doc.roundedRect(x,y,bxw,17,2,2,'FD');doc.setTextColor(...c);doc.setFont('helvetica','bold');doc.setFontSize(16);doc.text(String(v),x+4,y+9);doc.setFontSize(7.5);doc.setFont('helvetica','normal');doc.setTextColor(...MUT);doc.text(l,x+4,y+14)});
  y+=25;
  // issues
  const issues=s.qs.filter(q=>check.answers[q.ref]?.a==='N');const byTrade={};issues.forEach(q=>{const t=tagFor(q,check);(byTrade[t]=byTrade[t]||[]).push(q)});
  need(12);y+=txt(`Issues for trades (${issues.length})`,M,13,'bold');y+=2;
  if(!issues.length){y+=txt('No issues raised on this check.',M,9.5,'normal',MUT);y+=3}
  const gridPhotos=async(q,x0,wAll)=>{const ph=check.media.filter(m=>m.ref===q.ref&&m.kind==='photo');if(!ph.length)return;const gap=4,cw=(wAll-gap)/2,maxH=62;let col=0,rowH=0;let n=0;
    for(const p of ph){n++;const st=await stampPhoto(p,q,check,1100,0.7);const du=await blobToDataURL(st.blob);let w=cw,h=w*st.h/st.w;if(h>maxH){h=maxH;w=h*st.w/st.h}
      if(col===0){need(maxH+8)}const x=x0+col*(cw+gap)+(cw-w)/2;doc.addImage(du,'JPEG',x,y,w,h);doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(...MUT);doc.text(P(photoName(check,q,p,n)).slice(0,70),x0+col*(cw+gap),y+h+3);rowH=Math.max(rowH,h+6);
      if(col===1){y+=rowH;col=0;rowH=0}else col=1}
    if(col===1)y+=rowH;y+=2};
  for(const [t,qs] of Object.entries(byTrade)){need(10);doc.setFillColor(...NO);doc.rect(M,y-3.5,2,5,'F');y+=txt('Tag in Field: '+t,M+4,10,'bold');y+=1.5;
    for(const q of qs){const a=check.answers[q.ref]||{};const n=check.media.filter(x=>x.ref===q.ref&&x.kind==='photo').length;const lines=split(q.q,W-2*M-16,9.5).length+(a.note?split('Site note: '+a.note,W-2*M-16,9,'italic').length:0);need(lines*4.2+6);doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(...NO);doc.text(q.ref,M+4,y);let h=txt(q.q,M+16,9.5,'normal',INK,W-2*M-16);y+=h;if(a.note){y+=0.5;h=txt('Site note: '+a.note,M+16,9,'italic',INK,W-2*M-16);y+=h}y+=txt(`${a.meas?'MEASURED: '+a.meas+' '+(a.measUnit||'')+'  ·  ':''}${a.sev?'Severity: '+a.sev.toUpperCase()+'  ·  ':''}Field location: ${issueLoc(check,q)}  ·  Photos: ${n}  ·  Source: ${q.source||'—'}`,M+16,7.5,'normal',MUT,W-2*M-16);y+=2.5;
      await gridPhotos(q,M+16,W-2*M-16);doc.setDrawColor(...LINE);doc.line(M+4,y-1,W-M,y-1);y+=3}}
  // gaps
  const gaps=s.qs.filter(q=>{const a=check.answers[q.ref]||{};return !a.a||(a.a!=='NA'&&q.evidence!=='none'&&!check.media.some(x=>x.ref===q.ref&&x.kind==='photo'))});
  if(gaps.length){need(12);y+=3;y+=txt(`Open items and missing evidence (${gaps.length})`,M,13,'bold');y+=2;gaps.forEach(q=>{const a=check.answers[q.ref]||{};const why=!a.a?'Not answered':a.cert==='chased'?'Certificate not on site — chased':'No evidence photo';need(6);doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...MUT);doc.text(q.ref,M+4,y);y+=txt(`${why} · ${q.trade} · ${q.q}`,M+16,8.5,'normal',INK,W-2*M-16)+1.5})}
  // full checklist
  newPage();y+=txt('Full checklist',M,13,'bold');y+=3;
  modById(check.moduleId).sections.filter(x=>check.sections.includes(x.id)).forEach(sec=>{need(14);doc.setFillColor(240,237,231);doc.rect(M,y-4,W-2*M,6.5,'F');y+=txt(`${sec.id}. ${sec.title}`,M+2,9.5,'bold',ACC);y+=2;
    sec.questions.forEach(q=>{const a=check.answers[q.ref]||{};const n=check.media.filter(x=>x.ref===q.ref&&x.kind==='photo').length;const qw=W-2*M-62;const ql=split(q.q,qw,8.5);const nl=a.note?split('Note: '+a.note,qw,8.5,'italic'):[];const h=(ql.length+nl.length)*3.7+3;need(h+1);
      doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(...INK);doc.text(q.ref,M,y);doc.setFont('helvetica','normal');doc.text(ql,M+11,y);if(nl.length){doc.setFont('helvetica','italic');doc.setTextColor(...MUT);doc.text(nl,M+11,y+ql.length*3.7)}
      doc.setFont('helvetica','normal');doc.setTextColor(...MUT);doc.setFontSize(7.5);doc.text(split(q.trade,24,7.5),W-M-49,y);
      const c=colA(a.a);doc.setFillColor(...c);doc.roundedRect(W-M-23,y-3.2,13,4.6,1,1,'F');doc.setTextColor(a.a?255:110);doc.setFont('helvetica','bold');doc.setFontSize(7);doc.text(a.a?ansLabel[a.a]:'OPEN',W-M-16.5,y,{align:'center'});
      doc.setTextColor(...MUT);doc.setFont('helvetica','normal');doc.text(n?`${n} ph`:(a.cert==='chased'?'chased':'–'),W-M,y,{align:'right'});

  const photoList=[];s.qs.forEach(q=>{if(check.answers[q.ref]?.a==='N')return;let n=0;check.media.filter(x=>x.ref===q.ref&&x.kind==='photo').forEach(p=>{n++;photoList.push({p,q,n})})});
  if(photoList.length){newPage();y+=txt(`Evidence photos – passed and other items (${photoList.length})`,M,13,'bold');y+=1;y+=txt('Photos for issues are shown under each issue above.',M,8.5,'normal',MUT);y+=3;
    for(const {p,q,n} of photoList){const st=await stampPhoto(p,q,check,1400,0.72);const du=await blobToDataURL(st.blob);const maxW=W-2*M,maxH=(H-24-16)/2-12;let w=maxW,h=w*st.h/st.w;if(h>maxH){h=maxH;w=h*st.w/st.h}
      need(h+9);doc.addImage(du,'JPEG',M+(maxW-w)/2,y,w,h);y+=h+4;const an=check.answers[q.ref]||{};y+=txt(`Q${q.ref} · ${an.a?ansLabel[an.a]:'OPEN'} · ${q.trade} · ${q.q}${an.note?'  Site note: '+an.note:''}`,M,8.5,'normal',INK);y+=txt(photoName(check,q,p,n),M,7,'normal',MUT);y+=4}}

  doc.setProperties({title:`${check.moduleTitle} — B${check.block} ${check.area} L${check.level}`,author:check.inspector,creator:"SPS Critical Quality Check · Product of DaveBot",subject:'SJWS-CQC-v1'});
  return doc.output('blob');
}
